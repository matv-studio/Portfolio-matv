# Configuration de Pages CMS (https://pagescms.org/docs/configuration/), tenue à jour par Revel.
settings:
  content:
    merge: true
content:
- name: projects
  label: Projects
  type: collection
  path: content/projects
  filename: '{fields.slug}.md'
  view:
    primary: name
    fields:
    - name
    - slug
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: slug
    label: Slug
    type: string
    required: true
  - name: overview
    label: Overview
    type: text
  - name: cover
    label: Cover
    type: image
  - name: year
    label: Year
    type: string
  - name: client
    label: Client
    type: string
  - name: scope
    label: Scope
    type: string
  - name: duration
    label: Duration
    type: string
  - name: button_text
    label: Button text
    type: string
  - name: button_link
    label: Button link
    type: string
  - name: video
    label: Video
    type: file
  - name: video_2
    label: Second video
    type: file
  - name: gallery
    label: Gallery
    type: image
    list: true
  - name: order
    label: Order
    type: number
  - name: body
    label: Story
    type: rich-text
    options:
      format: html
media:
  input: media
  output: /media
